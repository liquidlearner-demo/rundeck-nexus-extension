[project]
name = "rundeck-diagnostics-gateway"
version = "0.1.0"
description = "MCP gateway exposing diagnostic-tagged Rundeck jobs to incident.io Investigations (Nexus)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.3",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
rundeck-diagnostics-gateway = "server:main"
